}
function padInit() {
  const cv = $('#pad'); if (!cv) return;
  const fit = () => {
    const r = cv.getBoundingClientRect(), dpr = Math.min(3, window.devicePixelRatio || 1); if (!r.width) return;
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); S.h = Math.round(1000 * r.height / r.width); sigPaint(cv, S.strokes);
  };
  S.fit = fit; fit();
  let cur = null, pid = null;
  const add = e => {
    const r = cv.getBoundingClientRect(), x = clamp(Math.round((e.clientX - r.left) / r.width * 1000), 0, 1000), y = clamp(Math.round((e.clientY - r.top) / r.width * 1000), 0, S.h), n = cur.length;
    if (n && Math.abs(x - cur[n - 2]) + Math.abs(y - cur[n - 1]) < 3) return;
    if (S.strokes.reduce((m, s) => m + s.length, n) >= 6000) return; // 3,000 points is far more than a signature needs
    cur.push(x, y);
    const ctx = cv.getContext('2d'), k = cv.width / 1000;
    ctx.beginPath(); ctx.moveTo((n ? cur[n - 2] : x) * k, (n ? cur[n - 1] : y) * k); ctx.lineTo(x * k + (n ? 0 : 0.1), y * k); ctx.stroke();
  };
  cv.addEventListener('pointerdown', e => { if (pid !== null || e.button > 0) return; e.preventDefault(); pid = e.pointerId; try { cv.setPointerCapture(pid); } catch (x) { /* drawing still works inside the pad */ } cur = []; add(e); });
  cv.addEventListener('pointermove', e => { if (e.pointerId !== pid || !cur) return; e.preventDefault(); const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : []; (evs.length ? evs : [e]).forEach(add); });
  const end = e => { if (e.pointerId !== pid) return; pid = null; if (cur && cur.length) S.strokes.push(cur); cur = null; sigPaint(cv, S.strokes); };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  cv.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
  cv.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
}
window.addEventListener('resize', () => { if (S.fit && $('#pad')) S.fit(); });

/* ---- the agreement and the form ---- */
function viewAgreement() {
  const d = S.doc, t = T[S.lang], L = d.lessor, money = n => nfmt(n, S.lang);
  const sum = d.items.reduce((n, i) => n + (Number(i.value) || 0), 0);
  const fact = (label, value, cls) => `<div><dt>${esc(label)}</dt><dd${cls ? ` class="${cls}"` : ''}>${value}</dd></div>`;
  const lessorLines = [[L.street, L.city].filter(Boolean).join(', '), L.cvr ? `CVR-nr.: ${L.cvr}` : '', L.phone ? `${t.phone}: ${L.phone}` : '', L.email || ''].filter(Boolean).map(x => `<br>${esc(x)}`).join('');
  let h = `<p class="lead">${esc(t.lead)}</p><p class="note">${esc(t.priv)}</p>`;
  h += `<section class="sheet"><div><h1>${esc(t.title)}</h1><p class="muted num">${esc(t.dateLbl)}: ${esc(dmy(d.date))}</p></div>`;
  h += `<dl class="parties">${fact(t.lessor, `<b>${esc(L.name)}</b>${lessorLines}`)}${fact(t.renter, `<b>${esc(d.renter)}</b>`)}</dl>`;
  h += `<dl class="facts">${fact(t.period, `${esc(dmy(d.start))} – ${d.due ? esc(dmy(d.due)) : '…'}`, 'num')}${d.place ? fact(t.place, esc(d.place)) : ''}${num(d.price) ? fact(t.price, `${esc(money(num(d.price)))} DKK`, 'num') : ''}`;
  h += `${d.deposit ? fact(t.deposit, `${esc(money(num(d.deposit)))} DKK`, 'num') : ''}${fact(t.deductible, d.deductible ? `${esc(money(num(d.deductible)))} DKK` : esc(t.none), 'num')}</dl>`;
  h += `<h2>${esc(t.equip)} · <span class="count">${d.items.length}</span></h2><ul class="gear">${d.items.map(i => {
    const meta = [i.serial ? `${t.cols[2]} ${i.serial}` : '', Number(i.value) ? `${t.cols[3]} ${money(i.value)}` : '', i.cond ? `${t.cond}: ${i.cond}` : ''].filter(Boolean).join(' · ');
    return `<li><span class="id">${esc(i.id)}</span><span class="what"><b>${esc(i.name)}</b>${meta ? `<small class="num">${esc(meta)}</small>` : ''}</span></li>`;
  }).join('')}</ul><p class="total">${esc(t.total)}: ${esc(money(sum))} DKK</p>`;
  h += `<h2>${esc(t.terms)}</h2><div class="terms">${d.terms.split('\n').map(p => p.trim()).filter(Boolean).map(p => `<p>${esc(p)}</p>`).join('')}</div></section>`;
  h += `<form class="sheet" id="f" novalidate autocomplete="on"><h2>${esc(t.you)}</h2><div class="fields">`;
  h += `<div class="field full"><label class="lbl" for="name">${esc(t.name)}</label><input id="name" type="text" autocomplete="name" autocapitalize="words" spellcheck="false" maxlength="120"><p class="note">${esc(t.nameHint)}</p></div>`;
  h += `<div class="field full"><label class="lbl" for="addr">${esc(t.addr)}</label><textarea id="addr" rows="2" autocomplete="street-address" maxlength="300"></textarea></div>`;
  h += `<div class="field"><label class="lbl" for="rid">${esc(t.rid)}</label><input id="rid" type="text" autocomplete="off" spellcheck="false" maxlength="60"></div>`;
  h += `<div class="field"><label class="lbl" for="contact">${esc(t.contactIn)}</label><input id="contact" type="text" autocomplete="off" spellcheck="false" maxlength="120"></div></div>`;
  h += `<label class="check" for="accept"><input type="checkbox" id="accept"><span>${esc(d.accept)}</span></label>`;
  h += `<div class="field"><span class="lbl" id="pad-l">${esc(t.here)}</span><div class="pad"><canvas id="pad" role="img" aria-labelledby="pad-l"></canvas><span class="x" aria-hidden="true">×</span></div></div>`;
  h += `<p class="err" id="msg" role="alert" hidden></p><div class="actions"><button class="btn primary big" id="go" type="submit">${esc(t.go)}</button><button class="btn" id="clear" type="button">${esc(t.clear)}</button></div></form>`;
  show(h);
  padInit();
  $('#clear').addEventListener('click', () => { S.strokes = []; sigPaint($('#pad'), []); });
  $('#f').addEventListener('submit', e => { e.preventDefault(); sign(); });
}
async function sign() {
  const t = T[S.lang], name = nfc($('#name').value), addr = String($('#addr').value || '').trim(), go = $('#go');
  const say = (m, el) => { const e = $('#msg'); e.textContent = m; e.hidden = !m; if (m && el) el.focus(); };
  if (!name) return say(t.needName, $('#name'));
  if (!addr) return say(t.needAddr, $('#addr'));
  if (!$('#accept').checked) return say(t.needAccept, $('#accept'));
  if (sigInk(S.strokes) < 120) return say(t.needInk);
  say(''); go.disabled = true; go.textContent = t.working;
  const now = new Date();
  const rec = { v: 1, h: S.hash, l: S.lang, n: name.slice(0, 120), a: addr.slice(0, 300), r: nfc($('#rid').value).slice(0, 60), c: nfc($('#contact').value).slice(0, 120),
    t: now.toISOString(), z: -now.getTimezoneOffset(), p: S.h, s: S.strokes.map(s => s.join(',')), u: String(navigator.userAgent || '').slice(0, 240) };
  S.code = 'AKHCSIG1.' + await zipJson(rec) + '.END';
  try { await Promise.race([pdfLib, new Promise((_, rej) => setTimeout(() => rej(new Error('PDF library is slow')), 20000))]); S.pdf = makePdf(S.doc, rec, S.hash, S.code); }
  catch (e) { console.error(e); S.pdf = null; }
  viewDone();
}

/* ---- the signed PDF: the same layout as the lessor's copy, with the return code tucked into its keywords ---- */
function sigWhen(rec, lang) {
  const tz = Number(rec.z) || 0, d = new Date(Date.parse(rec.t) + tz * 60000), ab = Math.abs(tz);
  return `${pad2(d.getUTCDate())}.${pad2(d.getUTCMonth() + 1)}.${d.getUTCFullYear()} ${T[lang].at} ${pad2(d.getUTCHours())}:${pad2(d.getUTCMinutes())} (UTC${tz < 0 ? '-' : '+'}${pad2(Math.floor(ab / 60))}:${pad2(ab % 60)})`;
}
function makePdf(d, rec, hash, code) {
  const { jsPDF } = window.jspdf, lang = S.lang, t = T[lang], L = d.lessor, pdf = new jsPDF({ unit: 'mm', format: 'a4', compress: true });
  pdf.setProperties({ title: `${t.title} ${d.renter}`, creator: 'AKHC Gear', keywords: code });
  const clean = s => String(s ?? '').replace(/[–—]/g, '-').replace(/×/g, 'x').replace(/[“”„]/g, '"').replace(/[‘’]/g, "'").replace(/[^\n\x20-\xFF]/g, '');
  const txt = (s, x, y, o) => pdf.text(clean(s), x, y, o);
  const font = (st, sz, gray) => { pdf.setFont('helvetica', st); pdf.setFontSize(sz); pdf.setTextColor(gray || 0); };
  const money = n => nfmt(n, lang);
  const top = first => { font('bold', first ? 19 : 12); txt(L.name, 105, first ? 17 : 13, { align: 'center' }); };
  const newPage = () => { pdf.addPage(); top(false); return 34; };
  top(true);
  font('bold', 14); txt(t.title, 18, 42);
  font('normal', 9); txt(`${t.dateLbl}: ${dmy(d.date)}`, 18, 48);
  font('bold', 8, 100); txt(t.lessor.toUpperCase(), 18, 60); txt(t.renter.toUpperCase(), 108, 60);
  font('normal', 10);
  [L.name, L.street, L.city, L.cvr ? `CVR-nr.: ${L.cvr}` : '', [L.phone, L.email].filter(Boolean).join(' - ')].filter(Boolean).forEach((s, i) => txt(s, 18, 66 + i * 4.8));
  const rl = [d.renter, ...String(rec.a || '').split('\n').map(s => s.trim()).filter(Boolean), rec.r ? `${t.id}: ${rec.r}` : '', rec.c ? `${t.contact}: ${rec.c}` : ''].filter(Boolean);
  rl.slice(0, 6).forEach((s, i) => { font(i === 0 ? 'bold' : 'normal', 10); pdf.splitTextToSize(clean(s), 82).slice(0, 1).forEach(x => pdf.text(x, 108, 66 + i * 4.8)); });
  let y = 96;
  font('bold', 8, 100); txt(t.period.toUpperCase(), 18, y);
  font('normal', 10); txt(`${t.from}: ${dmy(d.start)}     ${t.to}: ${dmy(d.due) || '________'}`, 18, y + 6);
  if (d.place) txt(`${t.place}: ${d.place}`, 108, y + 6);
  y += 16;
  const head = yy => { font('bold', 8, 100); txt(t.cols[0], 31, yy, { align: 'right' }); txt(t.cols[1], 34, yy); txt(t.cols[2], 128, yy); txt(t.cols[3], 192, yy, { align: 'right' }); pdf.setDrawColor(120); pdf.setLineWidth(0.2); pdf.line(18, yy + 1.8, 192, yy + 1.8); };
  font('bold', 8, 100); txt(t.equip.toUpperCase(), 18, y); y += 5; head(y); y += 7;
  let sum = 0;
  for (const it of d.items) {
    font('normal', 9.5);
    const nm = pdf.splitTextToSize(clean(it.name), 88), cond = it.cond ? pdf.splitTextToSize(clean(`${t.cond}: ${it.cond}`), 88) : [], h = (nm.length + cond.length) * 4.3 + 1.6, value = Number(it.value) || 0;
    if (y + h > 262) { y = newPage(); head(y); y += 7; }
    font('normal', 9.5); txt(it.id, 31, y, { align: 'right' }); nm.forEach((s, i) => pdf.text(s, 34, y + i * 4.3));
    txt(it.serial || '', 128, y); txt(value ? money(value) : '', 192, y, { align: 'right' });
    if (cond.length) { font('normal', 8, 90); cond.forEach((s, i) => pdf.text(s, 34, y + (nm.length + i) * 4.3)); }
    sum += value; y += h;
  }
  pdf.setDrawColor(120); pdf.line(18, y, 192, y); y += 6;
  font('bold', 10); txt(t.total, 128, y); txt(money(sum), 192, y, { align: 'right' }); y += 6;
  font('normal', 10);
  if (num(d.price)) { const amt = money(num(d.price)); txt(t.price, 192 - pdf.getTextWidth(amt) - 3, y, { align: 'right' }); txt(amt, 192, y, { align: 'right' }); y += 5.5; }
  if (d.deposit) txt(`${t.deposit}: ${money(num(d.deposit))} DKK`, 18, y); // only an older link can still carry a deposit
  txt(`${t.deductible}: ${d.deductible ? money(num(d.deductible)) + ' DKK' : t.none}`, d.deposit ? 108 : 18, y); y += 9;
  const need = 20 + pdf.splitTextToSize(clean(d.terms), 174).length * 4.1;
  if (y + Math.min(need, 90) > 262) y = newPage();
  font('bold', 8, 100); txt(t.terms.toUpperCase(), 18, y); y += 5;
  font('normal', 8.5);
  for (const para of String(d.terms || '').split('\n')) {
    const ls = pdf.splitTextToSize(clean(para), 174);
    if (y + ls.length * 4.1 > 262) { y = newPage(); font('normal', 8.5); }
    ls.forEach(s => { pdf.text(s, 18, y); y += 4.1; }); y += 1.2;
  }
  if (y > 212) y = newPage();
  y = Math.max(y + 28, 230);
  const st = rec.s.map(s => s.split(',').map(Number)), b = sigBox(st), k = Math.min(64 / Math.max(b.x1 - b.x0, 1), 20 / Math.max(b.y1 - b.y0, 1), 0.11), ox = 108 + 3 - b.x0 * k, oy = y + 1.5 - b.y1 * k;
  pdf.setDrawColor(0); pdf.setLineWidth(0.4); pdf.setLineCap(1); pdf.setLineJoin(1);
  for (const p of st) {
    if (p.length < 4) { pdf.line(ox + p[0] * k, oy + p[1] * k, ox + p[0] * k + 0.05, oy + p[1] * k); continue; }
    const seg = []; for (let i = 2; i + 1 < p.length; i += 2) seg.push([(p[i] - p[i - 2]) * k, (p[i + 1] - p[i - 1]) * k]);
    pdf.lines(seg, ox + p[0] * k, oy + p[1] * k, [1, 1], 'S', false);
  }
  pdf.setLineCap(0); pdf.setLineJoin(0);
  pdf.setDrawColor(0); pdf.setLineWidth(0.3); pdf.line(18, y, 88, y); pdf.line(108, y, 178, y);
  font('normal', 8, 90); txt(`${t.lessor}: ${t.sign}`, 18, y + 4.5);
  pdf.text(pdf.splitTextToSize(clean(`${t.renter}: ${rec.n}`), 82)[0], 108, y + 4.5); txt(`${t.esigned} ${sigWhen(rec, lang)}`, 108, y + 8.3);
  let ry = y + 16;
  font('bold', 7, 100); txt(t.record, 18, ry); ry += 3.6; font('normal', 7, 90);
  for (const ln of [t.device, `${t.stmt}: "${d.accept}"`, `${t.docid}: ${hash}`]) for (const x of pdf.splitTextToSize(clean(ln), 174)) { pdf.text(x, 18, ry); ry += 3.4; }
  const n = pdf.getNumberOfPages();
  for (let p = 1; p <= n; p++) {
    pdf.setPage(p); pdf.setDrawColor(120); pdf.setLineWidth(0.2); pdf.line(18, 281, 192, 281);
    font('normal', 7, 90); txt([L.name, L.street, L.city, L.cvr ? `CVR-nr.: ${L.cvr}` : ''].filter(Boolean).join(' - '), 105, 285, { align: 'center' });
    txt([L.phone ? `${t.phone}: ${L.phone}` : '', L.email ? `${t.mail}: ${L.email}` : ''].filter(Boolean).join(' - '), 105, 289, { align: 'center' });
    font('normal', 7.5, 90); txt(`${t.page} ${p} ${t.of} ${n}`, 192, 13, { align: 'right' });
    font('normal', 6.5, 110); txt(`ID ${hash.slice(0, 16)}`, 192, 16.5, { align: 'right' });
  }
  return pdf.output('blob');
}

/* ---- after signing: hand the PDF back ---- */
function viewDone() {
  const t = T[S.lang], d = S.doc, L = d.lessor;
  const name = `${t.fileBase}_${nfc(d.renter).replace(/[\\/:*?"<>|]+/g, '').replace(/\s+/g, '_')}_${String(d.start || '').slice(0, 10)}_${t.file}.pdf`;
  let h = `<section class="sheet done"><p class="tick" aria-hidden="true">✓</p><h1>${esc(t.doneH)}</h1><p class="lead">${esc(t.doneLead(L.name))}</p>`;
  let canShare = false;
  if (S.pdf) {
    try { S.file = new File([S.pdf], name, { type: 'application/pdf' }); canShare = !!(navigator.share && navigator.canShare && navigator.canShare({ files: [S.file] })); } catch (e) { canShare = false; }
    h += `<div class="actions">${canShare ? `<button class="btn primary big" id="share" type="button">${esc(t.share)}</button>` : ''}<a class="btn${canShare ? '' : ' primary big'}" id="dl" href="${URL.createObjectURL(S.pdf)}" download="${esc(name)}">${esc(t.download)}</a></div><p class="note">${esc(t.keep)}</p>`;
  } else h += `<p class="err">${esc(t.noPdf)}</p>`;
  h += `<dl><div><dt>${esc(t.sendTo)}</dt><dd><b>${esc(L.name)}</b>${L.phone ? `<br>${esc(t.phone)} ${esc(L.phone)}` : ''}${L.email ? `<br>${esc(L.email)}` : ''}</dd></div></dl>`;
  h += `<details${S.pdf ? '' : ' open'}><summary>${esc(t.codeH)}</summary><p class="note">${esc(t.codeLead)}</p><textarea id="code" rows="5" readonly spellcheck="false">${esc(S.code)}</textarea>`;
  h += `<div class="actions"><button class="btn" id="copy" type="button">${esc(t.copy)}</button>${L.email ? `<a class="btn" id="mail" href="mailto:${esc(String(L.email).replace(/[^\w.@+-]/g, ''))}?subject=${encodeURIComponent(t.mailSubject(d.renter))}&amp;body=${encodeURIComponent(t.mailBody + '\n\n' + S.code)}">${esc(t.mailIt)}</a>` : ''}</div><p class="note" id="copymsg" role="status"></p></details></section>`;
  show(h);
  if (canShare) $('#share').addEventListener('click', () => { navigator.share({ files: [S.file], title: t.shareTitle, text: t.shareText(d.renter) }).catch(() => { /* the share sheet was closed */ }); });
  $('#copy').addEventListener('click', async () => {
    const ta = $('#code'), say = m => { $('#copymsg').textContent = m; };
    try { await navigator.clipboard.writeText(ta.value); say(t.copied); return; } catch (e) { /* select it instead */ }
    ta.focus(); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    say(ok ? t.copied : t.copyFail);
  });
}

async function boot() {
  const frag = (location.hash || '').slice(1);
  if (!frag) return fail('errNo');
  let d = null; try { d = await unzipJson(frag); } catch (e) { return fail(frag[0] === '1' && typeof DecompressionStream !== 'function' ? 'errOld' : 'errBad'); }
  if (!okDoc(d)) return fail('errBad');
  S.doc = d; S.lang = d.lang === 'en' ? 'en' : 'da'; document.documentElement.lang = S.lang;
  S.hash = await sha256Hex(canon(d));
  const t = T[S.lang];
  document.title = `${t.kind} · ${d.lessor.name}`; $('#who').textContent = d.lessor.name; $('#kind').textContent = t.kind; $('#foot').textContent = t.foot;
  viewAgreement();
}
window.addEventListener('hashchange', () => location.reload());
boot();
})();
</script>
